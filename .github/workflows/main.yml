name: Build, Push and Update GitOps

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Application Repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }} 
          labels: ${{ steps.meta.outputs.labels }}  
          build-args: |
            BOT_SECRET_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push 
    permissions:
      contents: write 
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: 'egorpirkov/kachbot-gitops'
          token: ${{ secrets.GITOPS_REPO_PAT }} 
          path: gitops-repo

      - name: Update Image Tag in GitOps Manifest
        run: |
          cd gitops-repo
          
          IMAGE_TAG="sha-$(echo "${{ github.sha }}" | head -c 7)"
          echo "New image tag will be: $IMAGE_TAG"

          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Normalized lowercase image: ghcr.io/$IMAGE_NAME_LOWER"
          

          sed -i "s|image: ghcr.io/.*|image: ghcr.io/${IMAGE_NAME_LOWER}:${IMAGE_TAG}|g" ./deployment.yaml

      - name: Commit and Push to GitOps Repo
        run: |
          cd gitops-repo
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(deploy): update bot image to sha-$(echo "${{ github.sha }}" | head -c 7) [skip ci]"
            git push origin main
          else
            echo "No changes detected. Manifest is already up to date."
          fi