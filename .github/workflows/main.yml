name: Deploy Kachbot

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Restart Docker Containers
        run: |
          docker compose build tg-bot
          
          docker compose up -d --force-recreate tg-bot
          
          docker image prune -f